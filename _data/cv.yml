  image: ""
  summary: <p align="justify"> Ph.D. in Atmospheric and Space Sciences with a thesis focused on the development of an operational lightning forecast system using a global model and artificial intelligence (AI). As a Project Scientist II at the Indian Institute of Tropical Meteorology (IITM) under the National Monsoon Mission (NMM), two years of experience in the development of lightning parameterization in global models (GFS T1534 and BFS). Architect of a novel hybrid lightning forecast system (Two Autoencoder-based Classification or $C_{2AE}$  with results published in a peer-reviewed journal. To address the data volume of the km-scale global model (Bharat Forecast System or BFS) I/O, have developed and operationalised a parameter extraction tool that reduced data volume by a factor of 4× while increasing extraction speed by 12×. Work on organised convection indices and experiments conducted in WRF has been presented at international conferences. Skilled in programming, parallel computing, HPC, operational forecasting, research collaboration and research communication.</p>

