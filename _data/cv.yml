    Publications:
  
      - title: Performance of a novel NWP–AI hybrid lightning early warning system over Indian Subcontinent
        authors:
          - Rituparna Sarkar; Parthasarathi Mukhopadhyay; Sunil D Pawar 
        publisher:  Journal of Earth System Science 
        releaseDate: 2025-01-27
        url: https://doi.org/10.1007/978-981-97-7075-5_18
        summary: <p align="justify"> NWP models have difficulty in converting complex microphysical and dynamical processes in lightning. In contrast, data-driven AI models fail to capture the latent features associated with lightning activity. A novel NWP–AI hybrid lightning early warning system using a two-autoencoder-based classification model ($C_{2AE}$), which uses IMD WRF 9 km forecast as input, is discussed. The current version of $C_{2AE}$ uses mean square error as a loss function and, after finetuning, can forecast lightning activity with an error of 3% when tested over the training region. Further analysis of different thunderstorm-prone regions for March–April–May 2020 reveals that $C_{2AE}$ can capture the spatial and temporal distribution of lightning independent of the training region. </p>

      - title: Lightning Forecasting and Utilization of AI/ML in Early Warnings
        authors:
          - Rituparna Sarkar; Parthasarathi Mukhopadhyay
        publisher: Springer Nature Link 
        releaseDate: 2025-01-26
        url: https://de.wikisource.org/wiki/Über_einen_die_Erzeugung_und_Verwandlung_des_Lichtes_betreffenden_heuristischen_Gesichtspunkt
        summary: <p align="justify"> In recent years, the application of Artificial Intelligence (AI) in different sectors of society has become one of the most common technologies. As AI becomes a useful tool, incorporating AI in weather forecasts has also started rising. Lightning is one of India’s leading causes of casualty associated with natural disasters. An early warning system for lightning forecast is of utmost importance. However, the atmospheric processes associated with lightning are yet to be fully understood, making it challenging to simulate in a numerical weather prediction (NWP) model for operational purposes. Considering all these factors, in this chapter, we have discussed an AI-based deep learning approach for lightning prediction. This new AI-based lightning prediction system uses the Indian Meteorology Department (IMD) Weather Research and Forecasting (WRF) model at 9 km resolution as input which presently do not have any lightning product. The Indian Institute of Tropical Meteorology (IITM) Lightning Location Network (LLN) observation data is used as target vector to train the model. Due to the high imbalance of rare and severe events (RSEs) like lightning, we have used a novel approach of two-auto encoder-based classification ($C_{2AE}$) to train a deep-learning algorithm to correctly encode meteorological features associated with lightning and non-lightning incidents and, when the trained model is tested on a new dataset, it is able to correctly identify lightning events with statistical significance. </p>

      - title: Evaluation of ECMWF Lightning Flash Forecast over Indian Subcontinent during MAM 2020 
        authors:
          -  Rituparna Sarkar; Parthasarathi Mukhopadhyay; Peter Bechtold; Philippe Lopez; Sunil D. Pawar; Kaustav Chakravarty
        publisher: Atmosphere 
        releaseDate: 2022-09-17
        url: https://doi.org/10.3390/atmos13091520
        summary: <p align="justify"> During the pre-monsoon season (March–April–May), the eastern and northeastern parts of India, Himalayan foothills, and southern parts of India experience extensive lightning activity. Mean moisture, surface and upper-level winds, the sheared atmosphere in the lower level, and high positive values of vertically integrated moisture flux convergence (VIMFC) create favorable conditions for deep convective systems to occur, generating lightning. From mid-2018, the European Centre for Medium-Range Weather Forecasts (ECMWF) Integrated Forecasting System (IFS) operationally introduced lightning flash density on a global scale. This study evaluates the ECMWF lightning forecasts over India during the pre-monsoon season of 2020 using the Indian Institute of Tropical Meteorology (IITM) Lightning Location Network (LLN) observation data. Qualitative and quantitative analysis of the ECMWF lightning forecast has shown that the lightning forecast with a 72-h lead time can capture the spatial and temporal variation of lightning with a 90% skill score. </p>

